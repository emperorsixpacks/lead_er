<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lead_er</title>
<style>
  :root { --bg:#0f1220; --panel:#171a2b; --border:#2a2f4a; --text:#e6e8f0; --muted:#8a90a8; --accent:#6c8cff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:20px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; }
  header h1 { font-size:18px; margin:0; }
  .controls { padding:16px 24px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  input, select, button { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:14px; }
  input:focus, select:focus { outline:1px solid var(--accent); }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#0f1220; font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:600; position:sticky; top:0; background:var(--bg); }
  tr:hover td { background:#1a1e33; }
  a { color:var(--accent); text-decoration:none; }
  .badge { padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; }
  .new{background:#3a3f5a;color:#c7cbe0}.enriched{background:#27406b;color:#a9c6ff}
  .verified{background:#1f5e54;color:#8ff0dd}.personalized{background:#5b3a72;color:#e2c6ff}
  .sent{background:#6b5a1f;color:#ffe08a}.opened{background:#2f5e3a;color:#b0ffc4}
  .clicked{background:#20586b;color:#a5eaff}.replied{background:#1f6e4f;color:#9affd0}
  .bounced,.unsub,.invalid{background:#6b2430;color:#ffb7c2}
  .empty { padding:40px; text-align:center; color:var(--muted); }
  #count { color:var(--muted); font-size:12px; margin-left:8px; }
</style>
</head>
<body>
<header>
  <h1>lead_er</h1>
  <span id="count"></span>
  <div style="flex:1"></div>
  <button class="primary" id="discover">Discover</button>
</header>

<div class="controls">
  <input id="q" placeholder="Search (name, category, email…)" style="width:260px">
  <select id="status">
    <option value="">All statuses</option>
    <option>new</option><option>enriched</option><option>verified</option>
    <option>personalized</option><option>sent</option><option>opened</option>
    <option>clicked</option><option>replied</option><option>bounced</option>
    <option>unsub</option><option>invalid</option>
  </select>
  <input id="category" placeholder="Category" style="width:140px">
  <input id="city" placeholder="City" style="width:120px">
  <select id="hasEmail">
    <option value="">Email: any</option>
    <option value="true">Has email</option>
    <option value="false">No email</option>
  </select>
</div>

<table>
  <thead>
    <tr><th>Business</th><th>Category</th><th>City</th><th>Website</th><th>Email</th><th>Status</th><th>Hook</th><th></th></tr>
  </thead>
  <tbody id="rows"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody>
</table>

<script>
const $ = (id) => document.getElementById(id);
const rows = $("rows");

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function badge(status) {
  return `<span class="badge ${esc(status)}">${esc(status || "new")}</span>`;
}

async function load() {
  const params = new URLSearchParams();
  if ($("q").value) params.set("q", $("q").value);
  if ($("status").value) params.set("status", $("status").value);
  if ($("category").value) params.set("category", $("category").value);
  if ($("city").value) params.set("city", $("city").value);
  if ($("hasEmail").value) params.set("has_email", $("hasEmail").value);
  params.set("limit", "200");

  rows.innerHTML = '<tr><td colspan="8" class="empty">Loading…</td></tr>';
  const r = await fetch("/leads?" + params.toString());
  const leads = await r.json();
  $("count").textContent = `${leads.length} leads`;

  if (!leads.length) {
    rows.innerHTML = '<tr><td colspan="8" class="empty">No leads. Hit "Discover" to find some.</td></tr>';
    return;
  }
  rows.innerHTML = leads.map(l => `
    <tr>
      <td><strong>${esc(l.business_name)}</strong></td>
      <td>${esc(l.category)}</td>
      <td>${esc(l.city)}</td>
      <td>${l.website ? `<a href="${esc(l.website)}" target="_blank">site</a>` : ""}</td>
      <td>${esc(l.email)} ${l.email_status ? `<span class="badge ${l.email_status}">${esc(l.email_status)}</span>` : ""}</td>
      <td>${badge(l.status)}</td>
      <td style="color:var(--muted)">${esc(l.hook)}</td>
      <td><button onclick="send('${l.id}')">Send</button></td>
    </tr>`).join("");
}

async function send(id) {
  await fetch(`/pipeline/send/${id}`, { method: "POST" });
  load();
}

let t;
$("q").oninput = $("category").oninput = $("city").oninput = () => { clearTimeout(t); t = setTimeout(load, 300); };
$("status").onchange = $("hasEmail").onchange = load;

$("discover").onclick = async () => {
  $("discover").textContent = "Discovering…";
  await fetch("/pipeline/discover", { method: "POST" });
  setTimeout(() => { $("discover").textContent = "Discover"; load(); }, 1500);
};

load();
</script>
</body>
</html>
